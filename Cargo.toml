[package]
name = "engi"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
num = "0.4"
itertools = "0.15"
thiserror = "2.0"
derive_more = { version = "2", features = ["from", "deref", "deref_mut", "is_variant", "into",] }
float_eq = "1.0"
ordered-float = "5.3"
dashmap = "6"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
crabtime = "1.1.4"
faer = "0.24"
nlopt = "0.8"
cranelift = {version = "0.135", features = ["jit", "module", "native"]}

engi-macros = { path = "./macros" }

[dev-dependencies]
criterion = "0.8"

[build-dependencies]
syn = { version = "3.0", features = ["full"] }
quote = "1.0"
proc-macro2 = "1.0"
itertools = "0.15"

[[bench]]
name = "diff"
harness = false
